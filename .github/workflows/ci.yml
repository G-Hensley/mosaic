name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit --audit-level=high

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Advisory Linux build, kept green-or-ignored on purpose.
  #
  # Mosaic is Windows-only today, but nothing in the Rust is actually
  # Windows-gated: there is no `cfg(windows)` outside `worktree.rs`'s path
  # comparison and the ConPTY measurement harness, and portable-pty carries a
  # Unix backend of its own. The remaining Windows assumptions (the `cmd.exe /c`
  # launch routing, `LOCALAPPDATA`, the PowerShell shell type) are runtime
  # choices rather than compile-time ones, so this should build.
  #
  # "Should" is why this is advisory. It runs on every PR to catch the day
  # someone adds a genuine Windows-only dependency, while a port is still
  # hypothetical and a red job here must not block unrelated work. Drop
  # `continue-on-error` and make it required once a Linux port actually lands.
  rust-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      # Tauri's Linux prerequisites. The crate links against WebKitGTK, so
      # without these the build fails for reasons that say nothing about Mosaic.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
        working-directory: .
      - run: cargo clippy --all-targets
      - run: cargo test
